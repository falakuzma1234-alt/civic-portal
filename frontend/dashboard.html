<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Dashboard</title>
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Citizen Dashboard</div>
      <ul class="nav-links">
        <li><span id="welcome"></span></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </nav>
  </header>

  <div class="dash-container">

    <div class="panel">
      <h3>Nayi Complaint / Service Request</h3>
      <form id="complaintForm">
        <label for="department">Department</label>
        <select id="department" required>
          <option value="">-- Chuno --</option>
          <option>Water Supply</option>
          <option>Electricity</option>
          <option>Street Lighting</option>
          <option>Waste Management</option>
          <option>Fire Services</option>
          <option>Public Health</option>
        </select>

        <label for="complaintType">Complaint Type</label>
        <input type="text" id="complaintType" placeholder="Jaise: No water supply" required>

        <label for="title">Title</label>
        <input type="text" id="title" required>

        <label for="description">Description</label>
        <textarea id="description" required></textarea>

        <label for="location">Location</label>
        <input type="text" id="location" required>

        <button type="submit">Submit</button>
      </form>
    </div>

    <div class="panel">
      <h3>Tracking ID se status dekho</h3>
      <input type="text" id="trackInput" placeholder="CMP-1001">
      <button id="trackBtn">Track</button>
      <div id="trackResult"></div>
    </div>

    <div class="panel wide">
      <h3>Meri Complaints</h3>
      <table>
        <thead>
          <tr><th>Tracking ID</th><th>Department</th><th>Title</th><th>Status</th><th>Remarks</th></tr>
        </thead>
        <tbody id="myList"></tbody>
      </table>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
